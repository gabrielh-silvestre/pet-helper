services:
  ollama:
    image: ollama/ollama:0.40.12
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  ollama-init:
    image: ollama/ollama:0.40.12
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${PET_HELPER_OLLAMA_MODEL:-llama3.1:8b}"]

  app:
    build: .
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      PET_HELPER_PROVIDER: ollama
      PET_HELPER_TODAY: ${PET_HELPER_TODAY:-2026-11-03}
      PET_HELPER_OLLAMA_MODEL: ${PET_HELPER_OLLAMA_MODEL:-llama3.1:8b}
    stdin_open: true
    tty: true

volumes:
  ollama-data:
